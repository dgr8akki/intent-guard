<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intent Guard</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-bar">
        <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="#2b3440" />
          <circle cx="16" cy="16" r="10.5" fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="1.6" />
          <circle cx="16" cy="16" r="6" fill="none" stroke="#fff" stroke-width="2.2" />
          <circle cx="16" cy="16" r="2.2" fill="#8ab4f8" />
        </svg>
        <span class="brand">Intent Guard</span>
        <span id="section" class="section"></span>
        <button id="settings" type="button" class="btn btn-icon" aria-label="Settings" title="Settings">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
            <circle
              cx="10"
              cy="10"
              r="6.4"
              fill="none"
              stroke="currentColor"
              stroke-width="2.6"
              stroke-dasharray="2.5 2.53"
            />
            <circle
              cx="10"
              cy="10"
              r="5"
              fill="currentColor"
              fill-opacity=".2"
              stroke="currentColor"
              stroke-width="1.3"
            />
            <circle cx="10" cy="10" r="1.9" fill="none" stroke="currentColor" stroke-width="1.3" />
          </svg>
        </button>
      </div>
    </header>

    <section id="setup" class="state" hidden>
      <p class="kicker">Welcome</p>
      <p class="lede">Connect your Jev API key once, then tell Intent Guard what you’re working on.</p>
      <button id="connect" type="button" class="btn btn-primary btn-wide">
        Connect Jev
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M5 11L11 5M6 5h5v5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </section>

    <form id="start-form" class="state" hidden>
      <div class="label-row">
        <label for="intent" class="kicker">What are you working on?</label>
        <span id="count" class="count" aria-live="polite"></span>
      </div>
      <textarea
        id="intent"
        class="task-input"
        rows="2"
        maxlength="200"
        required
        placeholder="Compare flights to Goa for December"
        aria-describedby="count"
      ></textarea>
      <fieldset class="drift">
        <legend>Nudge after</legend>
        <div id="drift" class="seg">
          <label class="seg-opt"><input type="radio" name="drift" value="1" />1 min</label>
          <label class="seg-opt"><input type="radio" name="drift" value="2" checked />2 min</label>
          <label class="seg-opt"><input type="radio" name="drift" value="5" />5 min</label>
          <label class="seg-opt"><input type="radio" name="drift" value="10" />10 min</label>
        </div>
      </fieldset>
      <p class="hint">You’ll get a gentle nudge when you drift off task for that long.</p>
      <button type="submit" class="btn btn-primary btn-wide">
        Start
        <span class="keycap" aria-hidden="true">↵ Enter</span>
      </button>
    </form>

    <section id="active" class="state" hidden>
      <div class="kicker-row">
        <p class="kicker">Focusing on</p>
        <span id="elapsed" class="elapsed"
          ><span id="elapsed-value"></span><span id="elapsed-unit" class="unit"></span
        ></span>
      </div>
      <p id="active-intent" class="task"></p>
      <p id="drift-line" class="drift-line" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 2.2" />
          <circle cx="8" cy="8" r="2.4" fill="currentColor" />
        </svg>
        <span><span id="drift-text"></span> <span id="drift-detail" class="quiet"></span></span>
      </p>
      <p id="active-meta" class="meta"></p>
      <div id="allowed" class="allowed" hidden>
        <p class="kicker quiet">Allowed this session</p>
        <ul id="allowed-list"></ul>
      </div>
      <button id="end" type="button" class="btn btn-secondary">End session</button>
    </section>
  </body>
</html>
