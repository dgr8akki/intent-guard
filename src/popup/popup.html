<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intent Guard</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="brand">
      <img src="../icons/icon-32.png" width="20" height="20" alt="" />
      <h1>Intent Guard</h1>
    </header>

    <form id="start-form" class="stack">
      <label for="intent">What are you working on?</label>
      <textarea
        id="intent"
        rows="2"
        maxlength="200"
        required
        placeholder="Compare flights to Goa for December"
      ></textarea>
      <div class="row">
        <label for="drift" class="inline">Nudge after</label>
        <select id="drift">
          <option value="1">1 minute</option>
          <option value="2" selected>2 minutes</option>
          <option value="5">5 minutes</option>
          <option value="10">10 minutes</option>
        </select>
        <button type="submit" class="primary">Start</button>
      </div>
      <p class="hint">You'll get a gentle nudge when you drift off task for that long.</p>
    </form>

    <section id="active" class="stack" hidden>
      <p class="hint">Focusing on</p>
      <p id="active-intent" class="task"></p>
      <p id="active-meta" class="hint"></p>
      <button id="end" type="button">End session</button>
    </section>

    <form id="key-form" class="field">
      <label for="api-key">AI Gateway API key</label>
      <div class="row">
        <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="vck_…" />
        <button type="submit">Save</button>
      </div>
      <p id="key-status" class="hint" role="status">
        Stored only in this browser. Sent only to <span class="nowrap">ai-gateway.vercel.sh</span>.
      </p>
    </form>
  </body>
</html>
